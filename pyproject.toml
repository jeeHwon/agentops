[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codex-agentops"
version = "0.5.0"
description = "Version-pinned UC Skills, Agent Registry, and MLflow observability for Codex harness agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "databricks-agents>=1,<2",
  "databricks-sdk>=0.63,<1",
  "mlflow-skinny>=3.16.1,<4",
  "PyYAML>=6,<7",
]

[project.scripts]
aops = "codex_agentops.cli:main"
codex-agentops = "codex_agentops.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_agentops"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
