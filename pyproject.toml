[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aops-cli"
version = "0.1.0.dev10"
description = "Manage the AI agent lifecycle on top of existing harnesses and platforms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.2.176"]
codex = ["openai-codex>=0.163.0"]
serve = ["fastapi>=0.162", "uvicorn>=0.54", "python-multipart>=0.0.20"]
dbx = ["databricks-sdk>=0.158", "mlflow>=3.1"]

[project.scripts]
aops = "aops.cli:main"
aops-job = "aops.dbx.jobs:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "fastapi>=0.162",
  "httpx2>=2.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aops"]

[tool.hatch.build.targets.wheel.force-include]
"bundles/registry/tables.sql" = "aops/dbx/tables.sql"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
